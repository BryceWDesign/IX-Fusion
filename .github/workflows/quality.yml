name: quality-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install IX-Fusion
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run authoritative quality gate
        run: python check_green.py
